# ===================================================================
# LEGALTRACK - BACKEND APPLICATION PROPERTIES
# ===================================================================

spring.application.name=legaltrack-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration (Embedded Persistent H2 with MySQL Mode / or External MySQL)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/legaltrack;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------
# File Upload & Storage Configuration
# -------------------------------------------------------------------
app.storage.upload-dir=${FILE_STORAGE_PATH:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------------------------------------------------
# Court Integration & Schedulers
# -------------------------------------------------------------------
court.integration.enabled=${COURT_INTEGRATION_ENABLED:false}
court.integration.provider=${COURT_INTEGRATION_PROVIDER:mock}
case.sync.fixed-rate=${CASE_SYNC_FIXED_RATE:3600000}
hearing.reminder.cron=${HEARING_REMINDER_CRON:0 0 9 * * *}

# -------------------------------------------------------------------
# Swagger / OpenAPI
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
