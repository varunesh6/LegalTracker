# ===================================================================
# LEGALTRACK - POSTGRESQL PROFILE CONFIGURATION
# ===================================================================
# Activate with: --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/legaltrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL & PostgreSQL Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
